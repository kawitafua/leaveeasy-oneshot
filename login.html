<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ล็อกอินก่อนใช้งาน LeaveEasy — เหตุผลการลาของคุณจะไม่ถูกคนอื่นเปิดอ่าน</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มล็อกอิน">
        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="เช่น somchai@example.com" autocomplete="email">

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password">

        <div class="btn-row">
          <button type="submit" id="ปุ่มเข้าสู่ระบบ">เข้าสู่ระบบ</button>
          <a class="btn btn-ghost" href="register.html">ยังไม่มีบัญชี? สมัครสมาชิก</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
